<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ bot_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}body{display:flex;justify-content:center}
.app{display:flex;flex-direction:column;height:100%;width:100%;max-width:820px}
#log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;white-space:pre-wrap;line-height:1.5}
.msg.user{align-self:flex-end}.wait{opacity:.6}
form{display:flex;gap:10px;padding:14px}
input{flex:1;padding:12px;font:inherit;outline:none;min-width:0}
button{padding:12px 20px;font:inherit;cursor:pointer;border:0}
@media(max-width:640px){.app{display:flex;flex-direction:column}header{order:-1}.msg{max-width:92%}}
body{background:#1f3d2b;color:#f4f1e6;font-family:'Patrick Hand',cursive;font-size:19px}
.app{border:10px solid #8b5a2b;background:#2a4d38}
header{padding:16px;text-align:center;border-bottom:2px dashed #f4f1e666}h1{font-weight:400;font-size:2.2rem}header p{opacity:.8}
.msg{border:2px solid #f4f1e6;border-radius:6px 20px 6px 20px}.msg.user{background:#f4f1e622}
input{background:transparent;border:2px dashed #f4f1e6;color:inherit;border-radius:8px}::placeholder{color:#f4f1e699}
button{background:#f4d35e;color:#222;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <header><h1>{{ bot_name }}</h1><p>{{ tagline }}</p></header>
  <main id="log"></main>
  <form id="f">
    <input id="box" placeholder="Write your math doubt..." autocomplete="off">
    <button>Send</button>
  </form>
</div>
<script>
const NAME = {{ bot_name|tojson }};
const log = document.getElementById("log");
const box = document.getElementById("box");
const form = document.getElementById("f");
let history = [];

function add(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

add("model", "Hi! I'm " + NAME + ". Ask me anything about your studies.");

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = box.value.trim();
  if (!text) return;
  box.value = "";
  add("user", text);
  const pending = add("model", "Thinking...");
  pending.classList.add("wait");
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history})
    });
    const data = await res.json();
    pending.textContent = data.reply || data.error;
    if (data.reply) history.push({role: "user", text}, {role: "model", text: data.reply});
  } catch {
    pending.textContent = "Network error. Please try again.";
  }
  pending.classList.remove("wait");
};
</script>
</body>
</html>
